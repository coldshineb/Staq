<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>智力方块 (Staq)</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="assets/icon.png">
</head>
<body>
    <header class="app-header">
        <div class="brand">
            <img src="assets/icon.png" alt="icon" class="brand-logo">
            <span class="brand-title">智力方块</span>
            <span class="brand-badge">STAQ</span>
        </div>
        <div class="header-actions">
            <button id="btnMute" class="ui-btn">🔊 声音</button>
            <button id="btnLang" class="ui-btn">🌐 中文</button>
            <button id="btnRestart" class="ui-btn">🔄 新游戏</button>
            <button id="btnHelp" class="ui-btn primary">⌨️ 指南</button>
        </div>
    </header>

    <main class="app-layout">
        <section class="stage-section">
            <div class="canvas-card">
                <canvas id="gameCanvas" width="240" height="320"></canvas>
            </div>
            <div class="shortcuts-bar">
                <div class="shortcut-tag"><kbd>Space</kbd> 发射</div>
                <div class="shortcut-tag"><kbd>↑</kbd><kbd>↓</kbd> 移动</div>
                <div class="shortcut-tag"><kbd>←</kbd><kbd>→</kbd> 旋转</div>
                <div class="shortcut-tag"><kbd>Esc</kbd> 菜单</div>
            </div>
        </section>

        <aside id="helpDrawer" class="help-drawer active">
            <div class="drawer-header">
                <h3>操作指南与规则</h3>
                <button class="drawer-close" onclick="document.getElementById('helpDrawer').classList.toggle('active')">✕</button>
            </div>
            <div class="drawer-body">
                <div class="info-block">
                    <h4>电脑与触屏操作</h4>
                    <table class="control-table">
                        <tr><td>发射 / 确定</td><td><kbd>Space</kbd> <kbd>Enter</kbd> / 点击屏幕</td></tr>
                        <tr><td>上下移动</td><td><kbd>↑</kbd> <kbd>↓</kbd> / <kbd>W</kbd> <kbd>S</kbd> / 上下滑动</td></tr>
                        <tr><td>方块旋转</td><td><kbd>←</kbd> <kbd>→</kbd> / <kbd>A</kbd> <kbd>D</kbd> / 左右滑动</td></tr>
                        <tr><td>主菜单 / 暂停</td><td><kbd>Esc</kbd> / 点击左下角或右下角</td></tr>
                        <tr><td>静音切换</td><td><kbd>M</kbd></td></tr>
                    </table>
                </div>

                <div class="info-block">
                    <h4>游戏规则</h4>
                    <ul class="rule-list">
                        <li>向右发射方块，围成完整矩形即可触发消除。</li>
                        <li>框选矩形越大，连击得分越高。</li>
                        <li>方块未触碰障碍飞出屏幕将扣分惩罚。</li>
                        <li>当右侧任意一排障碍物抵达最左侧，游戏结束。</li>
                    </ul>
                </div>
            </div>
        </aside>
    </main>

    <script src="game.js"></script>
</body>
</html>
